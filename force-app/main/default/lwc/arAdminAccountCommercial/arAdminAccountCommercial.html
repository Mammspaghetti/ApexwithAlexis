<template>
  <div class="admin-list-header">
    <div>
      <h2 class="admin-section-title">{i18n.AR_AAC_Title}</h2>
      <p class="admin-list-subtitle">{countLabel}</p>
    </div>
    <button class="btn btn-primary" type="button" onclick={handleAdd}>
      {i18n.AR_AAC_AddAccount}
    </button>
  </div>

  <template if:true={isLoading}>
    <lightning-spinner
      alternative-text={i18n.AR_Common_Loading}
      size="small"
    ></lightning-spinner>
  </template>

  <template if:true={errorMessage}>
    <div class="error-message">{errorMessage}</div>
  </template>

  <template if:true={showForm}>
    <c-ar-admin-form-modal
      heading={i18n.AR_AAC_Title}
      saving={isSaving}
      onsave={handleSave}
      oncancel={handleCancel}
    >
      <div class="admin-form-row">
        <div class="account-search-wrap">
          <lightning-input
            type="search"
            label={i18n.AR_Common_Account}
            placeholder={i18n.AR_Common_SearchAccount}
            value={accountSearchTerm}
            onchange={handleAccountSearchChange}
          ></lightning-input>
          <p class="account-selected-label">
            {formAccountLabel}<template if:true={formAccountCity}
              ><span class="account-city"> — {formAccountCity}</span></template
            >
          </p>
          <template if:true={hasAccountResults}>
            <ul class="account-results">
              <template for:each={accountResults} for:item="opt">
                <li key={opt.accountId}>
                  <button
                    class="btn btn-text"
                    type="button"
                    data-id={opt.accountId}
                    onclick={handleSelectAccount}
                  >
                    {opt.label}<template if:true={opt.city}
                      ><span class="account-city"> — {opt.city}</span></template
                    >
                  </button>
                </li>
              </template>
            </ul>
          </template>
        </div>
        <lightning-input
          type="number"
          label={i18n.AR_AAC_DefaultRfaPercent}
          step="0.01"
          min="0"
          value={formDefaultRfaPercent}
          onchange={handleRfaChange}
        ></lightning-input>
        <lightning-input
          type="text"
          label={i18n.AR_AAC_FrameworkContractRef}
          value={formFrameworkAgreementReference}
          onchange={handleFrameworkChange}
        ></lightning-input>
        <div class="admin-template-field">
          <lightning-combobox
            label={i18n.AR_Common_PtfTemplateAutoField}
            data-field="ptfTemplateCode"
            options={templateComboOptions}
            value={templateComboValue}
            onchange={handlePtfTemplateCodeChange}
          ></lightning-combobox>
          <template if:true={templateCodeIsUnknown}>
            <p class="admin-field-warning" role="alert">
              {unknownTemplateCodeMessage}
            </p>
          </template>
          <template if:true={templateOptionsError}>
            <p class="admin-field-warning" role="alert">
              {templateListErrorMessage}
            </p>
          </template>
        </div>
      </div>
      <div class="admin-form-row">
        <lightning-textarea
          label={i18n.AR_AAC_PriceGrid}
          value={formPricingGridNotes}
          onchange={handleGridNotesChange}
        ></lightning-textarea>
        <lightning-textarea
          label={i18n.AR_AAC_SpecificParameters}
          value={formSpecialTerms}
          onchange={handleSpecialTermsChange}
        ></lightning-textarea>
      </div>
    </c-ar-admin-form-modal>
  </template>

  <template if:true={isEmpty}>
    <div class="empty-state">{i18n.AR_AAC_Empty}</div>
  </template>

  <template if:false={isEmpty}>
    <template if:false={isLoading}>
      <div class="admin-table-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>{i18n.AR_Common_Account}</th>
              <th>{i18n.AR_AAC_DefaultRfaColumn}</th>
              <th>{i18n.AR_AAC_FrameworkContract}</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template for:each={rows} for:item="row">
              <tr key={row.id}>
                <td>{row.accountName}</td>
                <td>{row.defaultRfaPercent}</td>
                <td>{row.frameworkAgreementReference}</td>
                <td class="admin-table-actions">
                  <button
                    class="btn btn-text"
                    type="button"
                    data-id={row.id}
                    onclick={handleEdit}
                  >
                    {i18n.AR_Common_Edit}
                  </button>
                  <button
                    class="btn btn-text"
                    type="button"
                    data-id={row.id}
                    onclick={handleDelete}
                  >
                    {i18n.AR_Common_Delete}
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </template>
</template>
