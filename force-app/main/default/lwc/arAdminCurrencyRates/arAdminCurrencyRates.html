<template>
  <div class="admin-list-header">
    <div>
      <h2 class="admin-section-title">{i18n.AR_ACR_Title}</h2>
      <p class="admin-list-subtitle">{subtitleLabel}</p>
    </div>
    <button class="btn btn-primary" type="button" onclick={handleAdd}>
      {i18n.AR_ACR_AddRate}
    </button>
  </div>

  <template if:true={isLoading}>
    <lightning-spinner
      alternative-text={i18n.AR_Common_Loading}
      size="small"
    ></lightning-spinner>
  </template>

  <template if:true={errorMessage}>
    <div class="error-message">{errorMessage}</div>
  </template>

  <template if:true={showForm}>
    <c-ar-admin-form-modal
      heading={formTitle}
      save-label={saveButtonLabel}
      saving={isSaving}
      onsave={handleSave}
      oncancel={handleCancel}
    >
      <template if:true={isCorrectMode}>
        <p class="admin-form-hint">{i18n.AR_ACR_CorrectHelp}</p>
      </template>
      <div class="admin-form-row">
        <template if:true={isCorrectMode}>
          <lightning-input
            type="text"
            label={i18n.AR_Common_Currency}
            value={formCurrencyCode}
            disabled
          ></lightning-input>
          <lightning-input
            type="date"
            label={i18n.AR_Common_EffectiveDate}
            value={formEffectiveDate}
            disabled
          ></lightning-input>
        </template>
        <template if:true={isAddMode}>
          <lightning-combobox
            label={i18n.AR_Common_Currency}
            options={currencyOptions}
            value={formCurrencyCode}
            onchange={handleCurrencyChange}
          ></lightning-combobox>
          <lightning-input
            type="date"
            label={i18n.AR_Common_EffectiveDate}
            value={formEffectiveDate}
            onchange={handleEffectiveDateChange}
          ></lightning-input>
        </template>
        <lightning-input
          type="number"
          label={i18n.AR_ACR_RateToEur}
          step="0.000001"
          min="0"
          value={formRate}
          onchange={handleRateChange}
        ></lightning-input>
      </div>
    </c-ar-admin-form-modal>
  </template>

  <template if:true={isEmpty}>
    <div class="empty-state">{i18n.AR_ACR_EmptyState}</div>
  </template>

  <template if:false={isEmpty}>
    <template if:false={isLoading}>
      <div class="admin-table-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>{i18n.AR_Common_Currency}</th>
              <th>{i18n.AR_ACR_RateToEur}</th>
              <th>{i18n.AR_Common_EffectiveDate}</th>
              <th>{i18n.AR_Common_Status}</th>
              <th>{i18n.AR_ACR_EnteredBy}</th>
              <th>{i18n.AR_ACR_On}</th>
              <th>{i18n.AR_ACR_Corrected}</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template for:each={rates} for:item="row">
              <tr key={row.id}>
                <td>{row.currencyCode}</td>
                <td>{row.rateToEur}</td>
                <td>{row.formattedEffectiveDate}</td>
                <td>
                  <span class={row.statusClass}>{row.statusLabel}</span>
                </td>
                <td>{row.createdByName}</td>
                <td>{row.formattedCreatedDate}</td>
                <td>
                  <template if:true={row.isCorrected}>
                    <span class="rate-corrected-note">
                      {row.correctedNote}
                    </span>
                  </template>
                </td>
                <td class="admin-table-actions">
                  <button
                    class="btn btn-text"
                    type="button"
                    data-id={row.id}
                    onclick={handleCorrect}
                  >
                    {i18n.AR_ACR_Correct}
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </template>
</template>
