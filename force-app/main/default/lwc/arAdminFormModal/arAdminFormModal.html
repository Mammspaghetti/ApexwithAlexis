<template>
  <section
    role="dialog"
    tabindex="-1"
    class="slds-modal slds-fade-in-open afm-modal"
    aria-modal="true"
    aria-labelledby="admin-form-modal-heading"
    onkeydown={handleKeydown}
  >
    <div class="slds-modal__container afm-container">
      <header class="afm-header">
        <h2 id="admin-form-modal-heading" class="afm-title">{heading}</h2>
      </header>

      <div class="afm-body">
        <slot onslotchange={handleSlotChange}></slot>
      </div>

      <footer class="afm-footer">
        <button
          class="btn btn-secondary"
          type="button"
          disabled={saving}
          onclick={handleCancel}
        >
          {i18n.AR_Common_Cancel}
        </button>
        <button
          class="btn btn-primary"
          type="button"
          disabled={saving}
          onclick={handleSave}
        >
          {saveLabel}
        </button>
      </footer>
    </div>
  </section>
  <div
    class="slds-backdrop slds-backdrop_open afm-backdrop"
    onclick={handleCancel}
  ></div>
</template>
