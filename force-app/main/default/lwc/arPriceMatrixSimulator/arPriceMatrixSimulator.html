<template>
  <div class="sim-card">
    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text={labels.loading}
        size="medium"
      ></lightning-spinner>
    </template>

    <template if:false={isLoading}>
      <div class="sim-body">
        <!-- Session 167 : besoin lié non visible de l'utilisateur — avertissement (pas une erreur) ;
             le calcul reste affiché, les écritures sont bloquées. -->
        <template if:true={positionAccessDenied}>
          <div
            class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small"
            role="alert"
          >
            <span>{labels.positionAccessDeniedBanner}</span>
          </div>
        </template>
        <!-- Session 282 : matrice vue par partage (agence du propriétaire) — bandeau discret. -->
        <template if:true={readOnlyBannerMessage}>
          <div
            class="read-only-banner slds-m-bottom_small"
            data-id="read-only-banner"
            role="status"
          >
            <lightning-icon
              icon-name="utility:lock"
              size="xx-small"
            ></lightning-icon>
            <span>{readOnlyBannerMessage}</span>
          </div>
        </template>
        <template if:true={errorMessage}>
          <div class="slds-text-color_error slds-m-bottom_small">
            {errorMessage}
          </div>
        </template>
        <!-- Conditions bloquantes (taux de change absent, référentiel VIE/Nearshore incomplet,
             session 24 généralisé en session 28) : mêmes classes que le bandeau de statut "Refusée",
             pour un rendu bloquant cohérent sans dépendre d'un nouveau style dédié. Une par
             condition active, jamais fusionnées dans un seul texte — chacune nomme sa propre cause. -->
        <template for:each={blockingConditions} for:item="condition">
          <div
            key={condition.key}
            class="status-banner status-banner-rejected"
            role="alert"
          >
            <span>{condition.message}</span>
          </div>
        </template>
        <template if:true={statusBannerMessage}>
          <div class={statusBannerClass} role="alert">
            <span>{statusBannerMessage}</span>
            <span if:true={wonBadgeText} class="won-header-badge"
              >{wonBadgeText}</span
            >
          </div>
        </template>

        <!-- Notification « dérogation à traiter » (session 112, refonte UX 24/09) : carte flottante
             en bas à droite (position fixed, reste visible au défilement), entrée animée en CSS
             500 ms après l'affichage — aucun minuteur JS. Toute la carte est cliquable ; la croix
             la masque pour la durée de la visite (sans rien changer côté serveur). -->
        <template if:true={showDerogationToast}>
          <div
            class="derogation-panel derogation-toast"
            role="status"
            aria-live="polite"
          >
            <button
              class="derogation-toast-main"
              type="button"
              onclick={handleOpenDerogationDecision}
              aria-label={i18n.AR_PMS_DerogationPendingOpenQueue}
            >
              <span class="derogation-toast-title"
                >{i18n.AR_PMS_DerogationPending}</span
              >
              <span class="derogation-toast-go" aria-hidden="true">
                <lightning-icon
                  icon-name="utility:forward"
                  size="xx-small"
                ></lightning-icon>
              </span>
            </button>
            <button
              class="derogation-toast-close"
              type="button"
              onclick={handleDismissDerogationToast}
              aria-label={i18n.AR_PMS_HideNotification}
            >
              ×
            </button>
          </div>
        </template>

        <!-- Duplication et chaîne de négociation (session 22) -->
        <template if:true={hasMatrixId}>
          <!-- Session 282 : actions masquées en lecture seule, la chaîne de négociation reste consultable. -->
          <template if:true={canDuplicate}>
            <div class="duplicate-action slds-m-bottom_small">
              <button
                class="btn btn-secondary"
                type="button"
                disabled={positionAccessDenied}
                onclick={handleOpenDuplicateModal}
              >
                {labels.duplicate}
              </button>
              <!-- Session 180c : avenant piloté par la matrice (docs/180-avenant-depuis-la-matrice.md). -->
              <template if:true={isValidatedStatus}>
                <button
                  class="btn btn-secondary slds-m-left_small"
                  type="button"
                  data-id="create-avenant"
                  disabled={positionAccessDenied}
                  onclick={handleOpenAvenantModal}
                >
                  {i18n.AR_PTF_CreateAvenant}
                </button>
              </template>
            </div>
          </template>
          <c-ar-matrix-chain-panel
            record-id={matrixId}
          ></c-ar-matrix-chain-panel>
        </template>

        <!-- Avertissement « ce besoin a déjà des matrices » (session 184a2) : persistant jusqu'à fermeture -->
        <template if:true={existingMatricesMessage}>
          <div
            class="draft-resume-banner existing-matrices-banner"
            role="alert"
          >
            <span>
              <strong>{i18n.AR_PMS_NeedAlreadyHasMatrix}</strong>
              {existingMatricesMessage}
            </span>
            <div class="draft-resume-actions">
              <button
                class="btn btn-text"
                onclick={handleDismissExistingMatrices}
                type="button"
              >
                {i18n.AR_Common_Close}
              </button>
            </div>
          </div>
        </template>

        <!-- Bandeau de reprise de brouillon (session 13) : arrivée sans contexte, brouillon < 24h -->
        <template if:true={showDraftBanner}>
          <div class="draft-resume-banner">
            <span>{draftBannerLabel}</span>
            <div class="draft-resume-actions">
              <button
                class="btn btn-primary"
                onclick={handleResumeDraft}
                type="button"
              >
                {labels.resume}
              </button>
              <button
                class="btn btn-text"
                onclick={handleDismissDraftBanner}
                type="button"
              >
                {labels.dismiss}
              </button>
            </div>
          </div>
        </template>

        <!-- Indicateur discret d'autosauvegarde (session 13, trois états session 39) : jamais de toast -->
        <template if:true={showAutosaveIndicator}>
          <p class={autosaveIndicatorStateClass}>
            <span class="autosave-indicator-dot"></span>
            <span>{autosaveIndicatorLabel}</span>
          </p>
        </template>

        <!-- Sélecteur de besoin (session 82, refonte UX ; session 83 harmonisation) : uniquement
             quand la matrice AT s'ouvre sans contexte (pas de quick action, pas de matrice existante).
             Deux colonnes fixes plutôt que la recherche remplacée par l'aperçu (session 81) : la
             recherche reste visible et active en permanence à gauche — on peut changer d'avis et
             rechercher un autre besoin sans jamais perdre le champ de recherche — et l'aperçu du
             besoin choisi s'affiche à droite. Session 83 : liste persistante, surbrillance du
             sélectionné, seuil 1 caractère. -->
        <template if:true={showPositionSelector}>
          <div class="zone-card position-selector-card">
            <div class="zone-card-header">
              <div class="position-selector-header-left">
                <div class="position-selector-icon">
                  <lightning-icon
                    icon-name="utility:search"
                    size="small"
                  ></lightning-icon>
                </div>
                <div>
                  <span class="position-selector-title"
                    >{labels.positionSelectorTitle}</span
                  >
                  <p class="position-selector-subtitle">
                    {labels.positionSelectorSubtitle}
                  </p>
                </div>
              </div>
            </div>
            <div class="zone-card-body">
              <div class="position-selector-row">
                <div class="position-search-col">
                  <div class="position-search">
                    <div
                      class="position-search-bar"
                      id="position-search-input-wrapper"
                    >
                      <lightning-icon
                        icon-name="utility:search"
                        size="x-small"
                        class="position-search-icon"
                      ></lightning-icon>
                      <input
                        type="search"
                        class="slds-input position-search-input"
                        placeholder={labels.searchPositionPlaceholder}
                        aria-label={labels.searchPositionLabel}
                        value={positionSearchTerm}
                        oninput={handlePositionSearchChange}
                      />
                    </div>
                    <template if:true={showPositionDropdown}>
                      <ul class="besoin-results-list" role="list">
                        <template
                          for:each={enrichedPositionSearchResults}
                          for:item="opt"
                        >
                          <li key={opt.positionId} role="listitem">
                            <button
                              type="button"
                              class={opt.rowClass}
                              data-id={opt.positionId}
                              onclick={handleSelectPosition}
                            >
                              <div class="besoin-result-item-left">
                                <span class="besoin-result-position-name"
                                  >{opt.positionName}</span
                                >
                                <span class="besoin-result-account-name"
                                  >{opt.accountName}</span
                                >
                              </div>
                              <template if:true={opt.isSelected}>
                                <svg
                                  width="18"
                                  height="18"
                                  viewBox="0 0 24 24"
                                  class="besoin-result-check"
                                  aria-hidden="true"
                                >
                                  <circle
                                    cx="12"
                                    cy="12"
                                    r="10"
                                    fill="#d31876"
                                  ></circle>
                                  <path
                                    d="M8 12.5l2.5 2.5L16 9.5"
                                    fill="none"
                                    stroke="#ffffff"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                  ></path>
                                </svg>
                              </template>
                            </button>
                          </li>
                        </template>
                        <template if:true={showNoPositionResults}>
                          <li class="besoin-results-empty" role="listitem">
                            {labels.noPositionResults}
                          </li>
                        </template>
                      </ul>
                    </template>
                  </div>
                </div>
                <div class="position-preview-col">
                  <template if:true={isLoadingPositionPreview}>
                    <div class="position-preview-loading">
                      <lightning-spinner
                        alternative-text={labels.loadingPreview}
                        size="x-small"
                      ></lightning-spinner>
                    </div>
                  </template>
                  <template if:true={hasPositionPreview}>
                    <div class="position-preview-panel">
                      <div class="position-preview-header">
                        <div class="position-preview-header-left">
                          <h3 class="position-preview-title">
                            {selectedPositionPreview.positionName}
                          </h3>
                          <div class="position-preview-account-row">
                            <lightning-icon
                              icon-name="utility:company"
                              size="x-small"
                              class="position-preview-account-icon"
                            ></lightning-icon>
                            <template if:true={hasPreviewAccount}>
                              <button
                                type="button"
                                class="position-preview-account-link"
                                onclick={handleViewAccount}
                                aria-label={openAccountRecordAriaLabel}
                              >
                                {selectedPositionPreview.accountName}
                              </button>
                            </template>
                            <template if:false={hasPreviewAccount}>
                              <span class="position-preview-account-text"
                                >{selectedPositionPreview.accountName}</span
                              >
                            </template>
                          </div>
                        </div>
                        <div class="position-preview-header-right">
                          <template if:true={selectedPositionPreviewHasStatus}>
                            <span class={positionStatusBadgeClass}
                              >{selectedPositionPreview.status}</span
                            >
                          </template>
                        </div>
                      </div>
                      <hr class="position-preview-separator" />
                      <div class="position-preview-body">
                        <div class="preview-field">
                          <span class="preview-label">{labels.country}</span>
                          <span class="preview-value"
                            >{selectedPositionPreview.accountCountry}</span
                          >
                        </div>
                        <div class="preview-field">
                          <span class="preview-label"
                            >{labels.businessSector}</span
                          >
                          <span class="preview-value"
                            >{selectedPositionPreview.businessLine}</span
                          >
                        </div>
                        <div class="preview-field">
                          <span class="preview-label">{labels.perimeter}</span>
                          <span class="preview-value"
                            >{selectedPositionPreview.perimetre}</span
                          >
                        </div>
                        <div class="preview-field">
                          <span class="preview-label"
                            >{labels.contractTypeField}</span
                          >
                          <span class="preview-value"
                            >{selectedPositionPreview.contractType}</span
                          >
                        </div>
                        <div class="preview-field">
                          <span class="preview-label">{labels.contact}</span>
                          <span class="preview-value"
                            >{selectedPositionPreview.contactName}</span
                          >
                        </div>
                        <div class="preview-field">
                          <span class="preview-label"
                            >{labels.positionPreviewStartDate}</span
                          >
                          <span class="preview-value"
                            >{positionPreviewStartDateFormatted}</span
                          >
                        </div>
                        <div class="preview-field">
                          <span class="preview-label">{labels.createdOn}</span>
                          <span class="preview-value"
                            >{positionPreviewCreatedDateFormatted}</span
                          >
                        </div>
                      </div>
                      <div class="position-preview-footer">
                        <button
                          class="btn btn-secondary"
                          type="button"
                          onclick={handleViewPosition}
                        >
                          <lightning-icon
                            icon-name="utility:new_window"
                            size="xx-small"
                          ></lightning-icon>
                          {labels.view}
                        </button>
                        <button
                          class="btn btn-primary"
                          type="button"
                          onclick={handleConfirmPositionSelection}
                        >
                          {labels.createMatrixFromPosition}
                        </button>
                      </div>
                    </div>
                  </template>
                  <template if:false={hasPositionPreview}>
                    <div class="position-preview-placeholder">
                      <div class="position-preview-placeholder-icon-circle">
                        <lightning-icon
                          icon-name="utility:search"
                          size="large"
                          class="position-preview-placeholder-icon"
                        ></lightning-icon>
                      </div>
                      <p class="position-preview-placeholder-title">
                        {labels.noPositionSelectedTitle}
                      </p>
                      <p class="position-preview-placeholder-help">
                        {labels.noPositionSelectedHelp}
                      </p>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Zone 1 : contexte affaire (lecture seule) — card maquette (pricing-tool.html:1828-1836) -->
        <template if:true={hasPosition}>
          <div class="zone-card slds-m-bottom_medium">
            <div class="zone-card-header">
              <div class="zone-card-header-left">
                <span class="zone-badge">1</span>
                <div>
                  <p class="zone-header-title">{labels.zoneContextTitle}</p>
                  <p class="zone-header-subtitle">
                    {labels.zoneContextSubtitle}
                  </p>
                </div>
              </div>
            </div>
            <div class="zone-card-body">
              <!-- Grille 2 colonnes fidèle à la maquette (pricing-tool.html:1836-1881) : 5 champs
                   éditables (session 17) entrelacés avec les 5 équivalents lecture seule déjà
                   présents dans l'org — pas de doublon du sélecteur de besoin (déjà choisi en amont). -->
              <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <!-- Verrouillé (session 17b) : plus de placeholder "Sélectionner une entité"
                       invitant à saisir sur un champ qu'on ne peut plus modifier. -->
                  <template if:true={isEditable}>
                    <lightning-combobox
                      name="entity"
                      label={labels.entityLabel}
                      value={entity}
                      options={entityOptions}
                      dropdown-alignment="auto"
                      placeholder={labels.selectEntityPlaceholder}
                      onchange={handleEntityChange}
                    ></lightning-combobox>
                  </template>
                  <template if:false={isEditable}>
                    <template if:true={isEntityChangeableOnly}>
                      <lightning-combobox
                        name="entity"
                        label={labels.entityLabel}
                        value={entity}
                        options={entityOptions}
                        dropdown-alignment="auto"
                        disabled={isChangingEntity}
                        onchange={handleValidatedEntityChange}
                      ></lightning-combobox>
                    </template>
                    <template if:false={isEntityChangeableOnly}>
                      <lightning-input
                        type="text"
                        label={labels.entityLabel}
                        value={displayEntity}
                        disabled
                        class="readonly-input"
                      ></lightning-input>
                    </template>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <!-- Session 54 : lookup consultant (remplace la saisie libre AR_Consultant_Name__c) -->
                  <template if:true={isEditable}>
                    <template if:true={consultantId}>
                      <div class="zone1-field-with-link">
                        <lightning-input
                          type="text"
                          label={labels.consultant}
                          value={consultantLabel}
                          disabled
                          class="readonly-input"
                        ></lightning-input>
                        <template if:true={consultantUrl}>
                          <a
                            href={consultantUrl}
                            target="_blank"
                            rel="noopener"
                            class="zone1-link-icon"
                            title={labels.openRecord}
                            aria-label={labels.openRecord}
                          >
                            <lightning-icon
                              icon-name="utility:new_window"
                              size="x-small"
                            ></lightning-icon>
                          </a>
                        </template>
                      </div>
                      <button
                        type="button"
                        class="consultant-clear-link"
                        onclick={handleClearConsultant}
                      >
                        {labels.changeConsultant}
                      </button>
                    </template>
                    <template if:false={consultantId}>
                      <div class="consultant-search">
                        <lightning-input
                          type="search"
                          label={labels.consultant}
                          placeholder={labels.searchConsultantPlaceholder}
                          value={consultantSearchTerm}
                          onchange={handleConsultantSearchChange}
                        ></lightning-input>
                        <template if:true={showConsultantDropdown}>
                          <ul class="position-dropdown">
                            <template
                              for:each={consultantSearchResults}
                              for:item="opt"
                            >
                              <li
                                key={opt.consultantId}
                                data-id={opt.consultantId}
                                onclick={handleSelectConsultant}
                              >
                                {opt.label}
                              </li>
                            </template>
                            <template if:true={showNoConsultantResults}>
                              <li class="position-dropdown-empty">
                                {labels.noConsultantResults}
                              </li>
                            </template>
                          </ul>
                        </template>
                      </div>
                      <template if:true={showConsultantSuggestion}>
                        <p class="consultant-suggestion">
                          {labels.suggestedFromApplication}
                          {suggestedConsultantLabel} —
                          <button
                            type="button"
                            class="consultant-clear-link"
                            onclick={handleUseSuggestedConsultant}
                          >
                            {labels.use}
                          </button>
                        </p>
                      </template>
                      <template if:true={showLegacyConsultantName}>
                        <p class="consultant-legacy-note">
                          {labels.legacyTextPrefix} {consultantName}
                        </p>
                      </template>
                    </template>
                  </template>
                  <!-- Session 65 : badge discret de succès du pré-remplissage (cliquable pour voir détails) -->
                  <template if:true={showPrefillBanner}>
                    <!-- Badge discret par défaut (non-intrusive) -->
                    <template if:false={showPrefillDetails}>
                      <button
                        type="button"
                        class="prefill-success-badge"
                        onclick={handleShowPrefillDetails}
                        title={labels.clickForDetails}
                      >
                        {labels.prefillSuccess} {prefillBannerItems.length}
                        {prefillBannerCount}
                      </button>
                    </template>
                    <!-- Boîte détaillée (ouverte au clic) -->
                    <template if:true={showPrefillDetails}>
                      <div class="prefill-banner slds-m-top_small">
                        <div class="prefill-banner-header">
                          <span class="prefill-banner-count">
                            {prefillBannerItems.length} {prefillBannerCount}
                          </span>
                          <span>{prefillFromRecordLabel}</span>
                          <button
                            type="button"
                            class="prefill-close-btn"
                            onclick={handleClosePrefillDetails}
                            title={labels.close}
                          >
                            ✕
                          </button>
                        </div>
                        <ul class="prefill-banner-list">
                          <template
                            for:each={prefillBannerItems}
                            for:item="item"
                          >
                            <li key={item.field}>
                              <span class="field-name">{item.field}</span>
                              <span class="field-change">
                                {item.oldValue} → {item.newValue}
                              </span>
                            </li>
                          </template>
                        </ul>
                        <button
                          type="button"
                          class="prefill-banner-undo"
                          onclick={handleUndoPrefill}
                        >
                          {labels.undoPrefill}
                        </button>
                      </div>
                    </template>
                  </template>
                  <template if:false={isEditable}>
                    <template if:true={consultantUrl}>
                      <div class="zone1-field-label">
                        <span class="zone1-field-label-text"
                          >{labels.consultant}</span
                        >
                      </div>
                      <a
                        href={consultantUrl}
                        target="_blank"
                        rel="noopener"
                        class="zone1-link-field"
                        title={labels.openRecord}
                      >
                        {displayConsultantName}
                      </a>
                    </template>
                    <template if:false={consultantUrl}>
                      <lightning-input
                        type="text"
                        label={labels.consultant}
                        value={displayConsultantName}
                        disabled
                        class="readonly-input"
                      ></lightning-input>
                    </template>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <template if:true={managerUrl}>
                    <div class="zone1-field-label">
                      <span class="zone1-field-label-text"
                        >{labels.managerName}</span
                      >
                    </div>
                    <a
                      href={managerUrl}
                      target="_blank"
                      rel="noopener"
                      class="zone1-link-field"
                      title={labels.openRecord}
                    >
                      {positionContext.managerName}
                    </a>
                  </template>
                  <template if:false={managerUrl}>
                    <lightning-input
                      type="text"
                      label={labels.managerName}
                      value={positionContext.managerName}
                      disabled
                      class="readonly-input"
                    ></lightning-input>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <template if:true={isEditable}>
                    <div class="slds-form-element">
                      <label class="slds-form-element__label" for="clientSite">
                        {labels.clientSite}
                        <abbr class="slds-required" title="required">*</abbr>
                      </label>
                      <lightning-input
                        type="text"
                        name="clientSite"
                        label={labels.clientSite}
                        variant="label-hidden"
                        placeholder={labels.clientSitePlaceholder}
                        value={clientSite}
                        onchange={handleMissionTextChange}
                      ></lightning-input>
                    </div>
                  </template>
                  <template if:false={isEditable}>
                    <lightning-input
                      type="text"
                      label={labels.clientSite}
                      value={displayClientSite}
                      disabled
                      class="readonly-input"
                    ></lightning-input>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <template if:true={clientUrl}>
                    <div class="zone1-field-label">
                      <span class="zone1-field-label-text"
                        >{labels.accountName}</span
                      >
                    </div>
                    <a
                      href={clientUrl}
                      target="_blank"
                      rel="noopener"
                      class="zone1-link-field"
                      title={labels.openRecord}
                    >
                      {positionContext.accountName}
                    </a>
                  </template>
                  <template if:false={clientUrl}>
                    <lightning-input
                      type="text"
                      label={labels.accountName}
                      value={positionContext.accountName}
                      disabled
                      class="readonly-input"
                    ></lightning-input>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <template if:true={besoinUrl}>
                    <div class="zone1-field-label">
                      <span class="zone1-field-label-text"
                        >{labels.position}</span
                      >
                    </div>
                    <a
                      href={besoinUrl}
                      target="_blank"
                      rel="noopener"
                      class="zone1-link-field"
                      title={labels.openRecord}
                    >
                      {positionContext.positionName}
                    </a>
                  </template>
                  <template if:false={besoinUrl}>
                    <lightning-input
                      type="text"
                      label={labels.position}
                      value={positionContext.positionName}
                      disabled
                      class="readonly-input"
                    ></lightning-input>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <!-- Verrouillé (session 17b) : un sélecteur de date grisé n'affiche pas la valeur
                       de façon lisible — un texte formaté FR la remplace. -->
                  <template if:true={isEditable}>
                    <div class="slds-form-element">
                      <label class="slds-form-element__label" for="startDate">
                        {labels.startDate}
                        <abbr class="slds-required" title="required">*</abbr>
                      </label>
                      <lightning-input
                        type="date"
                        name="startDate"
                        data-date-field="startDate"
                        label={labels.startDate}
                        variant="label-hidden"
                        value={startDate}
                        onchange={handleStartDateChange}
                      ></lightning-input>
                    </div>
                  </template>
                  <template if:false={isEditable}>
                    <lightning-input
                      type="text"
                      label={labels.startDate}
                      value={displayStartDate}
                      disabled
                      class="readonly-input"
                    ></lightning-input>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <template if:true={isEditable}>
                    <div class="slds-form-element">
                      <label class="slds-form-element__label" for="endDate">
                        {labels.expectedEndDate}
                        <abbr class="slds-required" title="required">*</abbr>
                      </label>
                      <lightning-input
                        type="date"
                        name="endDate"
                        data-date-field="endDate"
                        label={labels.expectedEndDate}
                        variant="label-hidden"
                        value={endDate}
                        onchange={handleEndDateChange}
                      ></lightning-input>
                    </div>
                  </template>
                  <template if:false={isEditable}>
                    <lightning-input
                      type="text"
                      label={labels.expectedEndDate}
                      value={displayEndDate}
                      disabled
                      class="readonly-input"
                    ></lightning-input>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <lightning-input
                    type="text"
                    label={labels.country}
                    value={displayCountry}
                    disabled
                    class="readonly-input"
                  ></lightning-input>
                  <template if:true={showEntityCountryHelp}>
                    <p
                      class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small entity-country-help"
                    >
                      {labels.entityCountryMissingHelp}
                    </p>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <lightning-input
                    type="text"
                    label={labels.owner}
                    value={creatorName}
                    disabled
                    class="readonly-input"
                  ></lightning-input>
                </div>
              </div>
              <template if:true={hasMissionDateError}>
                <p
                  class="slds-text-color_error slds-text-body_small slds-m-top_x-small"
                >
                  {missionDateErrorText}
                </p>
              </template>

              <!-- Bandeau récapitulatif "{profil} — {région} — {secteur}" (pricing-tool.html:1877-1880) -->
              <template if:true={showRecapBanner}>
                <div class="recap-banner slds-m-top_medium">
                  <lightning-icon
                    icon-name="utility:pin"
                    size="xx-small"
                    class="recap-banner-icon"
                  ></lightning-icon>
                  <span>{recapBannerLabel}</span>
                </div>
              </template>

              <!-- Bandeau Grand Compte (session 14 en Zone 2, dupliqué ici en session 17) -->
              <template if:true={hasGrandCompteCorridor}>
                <div class="grand-compte-banner slds-m-top_medium">
                  <lightning-icon
                    icon-name="utility:favorite"
                    size="xx-small"
                    class="grand-compte-icon"
                  ></lightning-icon>
                  <span class="grand-compte-label"
                    >{thresholdsOriginLabel}
                  </span>
                  <span class="grand-compte-values"
                    >{grandCompteBannerLabel}
                    <span class="grand-compte-standard">
                      {i18n.AR_PMS_StandardCorridor}</span
                    ></span
                  >
                </div>
              </template>
            </div>
          </div>

          <!-- Repères marché : comparables réels sur l'historique gagné (session 9) -->
          <div class="market-card">
            <div class="market-header">
              <p class="market-title">{labels.marketReferenceTitle}</p>
              <div class="market-header-right">
                <button
                  class="info-trigger"
                  type="button"
                  onclick={handleToggleMarketInfo}
                  aria-expanded={showMarketInfoPopover}
                  aria-describedby="market-info-popover"
                  aria-label={labels.marketInfoAriaLabel}
                >
                  <lightning-icon
                    icon-name="utility:info"
                    size="xx-small"
                    class="info-icon"
                  ></lightning-icon>
                </button>
                <template if:true={hasMarketReference}>
                  <span class={marketConfidenceClass}
                    >{marketConfidenceLabel}</span
                  >
                </template>
              </div>
              <template if:true={showMarketInfoPopover}>
                <div
                  class="market-info-modal-root"
                  data-owner={uniqueComponentId}
                >
                  <div
                    class="market-info-modal-scrim"
                    onclick={handleToggleMarketInfo}
                  ></div>
                  <div
                    id="market-info-popover"
                    data-popover-panel="market"
                    class="info-popover market-info-modal"
                    role="dialog"
                    aria-label={labels.marketInfoModalAriaLabel}
                    tabindex="-1"
                    onclick={stopPopoverClick}
                  >
                    <div class="market-info-modal-header">
                      <p class="info-popover-title">
                        {labels.marketInfoModalTitle}
                      </p>
                      <button
                        class="market-info-modal-close"
                        type="button"
                        onclick={handleToggleMarketInfo}
                        aria-label={labels.close}
                      >
                        ✕
                      </button>
                    </div>
                    <!-- Stats compactes : pool, effectif pondéré, confiance -->
                    <div class="market-stats">
                      <div class="market-stat">
                        <p class="market-stat-label">{labels.pool}</p>
                        <p class="market-stat-value">
                          {marketReference.comparableCount}
                        </p>
                        <p class="market-stat-subtitle">
                          {marketCountryLabel} {labels.last12Months}
                        </p>
                      </div>
                      <div class="market-stat">
                        <p class="market-stat-label">
                          {labels.weightedEffective}
                        </p>
                        <p class="market-stat-value">
                          {marketWeightedEffectiveLabel}
                        </p>
                      </div>
                      <div class="market-stat">
                        <p class="market-stat-label">{labels.confidence}</p>
                        <p class={marketConfidenceValueClass}>
                          {marketConfidenceShortLabel}
                        </p>
                      </div>
                    </div>
                    <div class="market-pipeline">
                      <div class="pipeline-stage">
                        <div class="pipeline-num">
                          1
                          <span class="pipeline-connector"></span>
                        </div>
                        <div class="pipeline-content">
                          <p class="pipeline-title">
                            {labels.pipelineHistoryTitle}
                          </p>
                          <p class="pipeline-text">
                            {labels.pipelineHistoryPrefix}
                            <span style="font-weight: bold">{labels.won}</span>
                            {labels.pipelineHistorySuffix}
                          </p>
                        </div>
                      </div>
                      <div class="pipeline-stage">
                        <div class="pipeline-num">
                          2
                          <span class="pipeline-connector"></span>
                        </div>
                        <div class="pipeline-content">
                          <p class="pipeline-title">
                            {labels.pipelineFiltersTitle}
                          </p>
                          <template if:true={hasResolvedCountry}>
                            <div class="pipeline-tags-row">
                              <span class="pipeline-tag-pill"
                                >📍 {marketCountryLabel}</span
                              >
                              <template if:true={hasContractTypeLabel}>
                                <span class="pipeline-tag-pill"
                                  >📄 {contractTypeLabel}
                                  <span class="pipeline-tag-count"
                                    >· {marketReference.comparableCount}</span
                                  ></span
                                >
                              </template>
                            </div>
                          </template>
                          <template if:false={hasResolvedCountry}>
                            <p class="pipeline-text">
                              {labels.noCountryNoComparables}
                            </p>
                          </template>
                        </div>
                      </div>
                      <div class="pipeline-stage">
                        <div class="pipeline-num">
                          3
                          <span class="pipeline-connector"></span>
                        </div>
                        <div class="pipeline-content">
                          <p class="pipeline-title">
                            {labels.pipelineAlgorithmTitle}
                          </p>
                          <div class="weight-bar-container">
                            <div class="weight-bar-label">
                              <span>{labels.metier}</span>
                              <span>{metierPercentLabel}</span>
                            </div>
                            <div class="weight-bar-track">
                              <div
                                class="weight-bar-fill"
                                style={metierBarStyle}
                              ></div>
                            </div>
                            <p class="weight-bar-realized">
                              {marketMetierRealizedLabel}
                            </p>
                          </div>
                          <div class="weight-bar-container">
                            <div class="weight-bar-label">
                              <span>{labels.secteur}</span>
                              <span>{secteurPercentLabel}</span>
                            </div>
                            <div class="weight-bar-track">
                              <div
                                class="weight-bar-fill"
                                style={secteurBarStyle}
                              ></div>
                            </div>
                            <p class="weight-bar-realized">
                              {marketSecteurRealizedLabel}
                            </p>
                          </div>
                          <div class="weight-bar-container">
                            <div class="weight-bar-label">
                              <span>{labels.client}</span>
                              <span>{clientPercentLabel}</span>
                            </div>
                            <div class="weight-bar-track">
                              <div
                                class="weight-bar-fill"
                                style={clientBarStyle}
                              ></div>
                            </div>
                            <p class="weight-bar-realized">
                              {marketClientRealizedLabel}
                            </p>
                          </div>
                        </div>
                      </div>
                      <div class="pipeline-stage">
                        <div class="pipeline-num">
                          4
                          <span class="pipeline-connector"></span>
                        </div>
                        <div class="pipeline-content">
                          <p class="pipeline-title">
                            {labels.pipelineThresholdTitle}
                          </p>
                          <div class="confidence-chips-row">
                            <span class={highConfidenceChipClass}
                              ><template if:true={isHighConfidenceActive}
                                >✓ </template
                              >≥{marketReference.highConfidenceMin}
                              {labels.highConfidenceSuffix}</span
                            >
                            <span class={mediumConfidenceChipClass}
                              ><template if:true={isMediumConfidenceActive}
                                >✓ </template
                              >≥{marketReference.mediumConfidenceMin}
                              {labels.mediumConfidenceSuffix}</span
                            >
                            <span class={lowConfidenceChipClass}
                              ><template if:true={isLowConfidenceActive}
                                >✓ </template
                              >{labels.lowConfidenceSuffix}</span
                            >
                          </div>
                          <p class="pipeline-effective-line">
                            {labels.effectiveWeightedLine}
                            <strong>{marketWeightedEffectiveLabel}</strong> →
                            {marketConfidenceShortLabel}
                          </p>
                        </div>
                      </div>
                      <div class="pipeline-stage">
                        <div class="pipeline-num">5</div>
                        <div class="pipeline-content">
                          <p class="pipeline-title">
                            {labels.pipelineFinalCalcTitle}
                          </p>
                          <p class="pipeline-text">
                            {labels.pipelineFinalCalcText}
                          </p>
                        </div>
                      </div>
                    </div>
                    <p class="seniority-compact-label">
                      {labels.seniorityNote}
                    </p>
                    <template if:true={showMarketConversionNote}>
                      <p class="market-conversion-note">
                        {marketConversionNote}
                      </p>
                    </template>
                    <template if:true={showMarketNoRateNote}>
                      <p class="market-no-rate-note">{marketNoRateNote}</p>
                    </template>
                    <p class="modal-footer-note">{modalFooterNote}</p>
                  </div>
                </div>
              </template>
            </div>
            <template if:true={isLoadingMarketReference}>
              <lightning-spinner
                alternative-text={labels.loadingMarketRefs}
                size="x-small"
              ></lightning-spinner>
            </template>
            <template if:true={showMarketStats}>
              <div class="market-stats">
                <div class="market-stat">
                  <p class="market-stat-label">{labels.comparables}</p>
                  <p class="market-stat-value">
                    {marketReference.comparableCount}
                  </p>
                </div>
                <div class="market-stat">
                  <p class="market-stat-label">{labels.medianTjm}</p>
                  <p class="market-stat-value">{formattedMarketMedian}</p>
                </div>
                <div class="market-stat">
                  <p class="market-stat-label">{labels.top10Percent}</p>
                  <p class="market-stat-value">{formattedMarketP90}</p>
                </div>
              </div>
              <p class="market-circle-label">{marketReference.circleLabel}</p>
              <template if:true={showMarketConversionNote}>
                <p class="market-conversion-note">{marketConversionNote}</p>
              </template>
              <template if:true={showMarketNoRateNote}>
                <p class="market-no-rate-note">{marketNoRateNote}</p>
              </template>
            </template>
            <template if:true={showMarketLowConfidence}>
              <p class="market-low-confidence">{marketLowConfidenceMessage}</p>
            </template>
          </div>
        </template>

        <template if:true={hasPosition}>
          <div class="slds-grid slds-wrap slds-gutters">
            <!-- Zone 2 : contexte financier — card maquette (pricing-tool.html:1886-1889) -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <div class="zone-card">
                <div class="zone-card-header">
                  <div class="zone-card-header-left">
                    <span class="zone-badge">2</span>
                    <p class="zone-header-title">
                      {labels.zoneFinancialContextTitle}
                    </p>
                  </div>
                  <button
                    class="info-trigger"
                    type="button"
                    onclick={handleToggleThresholdsInfo}
                    aria-expanded={showThresholdsInfoPopover}
                    aria-describedby="thresholds-info-popover"
                    aria-label={labels.thresholdsInfoAriaLabel}
                  >
                    <lightning-icon
                      icon-name="utility:info"
                      size="xx-small"
                      class="info-icon"
                    ></lightning-icon>
                  </button>
                  <template if:true={showThresholdsInfoPopover}>
                    <div
                      id="thresholds-info-popover"
                      data-popover-panel="thresholds"
                      class="info-popover"
                      role="dialog"
                      aria-label={labels.thresholdsInfoAriaLabel}
                      tabindex="-1"
                      onclick={stopPopoverClick}
                    >
                      <p class="info-popover-title">
                        {labels.thresholdsInfoAriaLabel}
                      </p>
                      <dl class="info-popover-list">
                        <dt>{labels.costPerDayTerm}</dt>
                        <dd>{thresholdsFormulaCjmLine}</dd>
                        <dt>{labels.totalDailyCost}</dt>
                        <dd>{thresholdsFormulaCostLine}</dd>
                        <dt>{labels.tjmThresholdsTerm}</dt>
                        <dd>{thresholdsFormulaCorridorLine}</dd>
                        <dt>{labels.rfaAndFreeTerm}</dt>
                        <dd>{thresholdsFormulaRfaLine}</dd>
                      </dl>
                      <p class="info-popover-note">{thresholdsFormulaNote}</p>
                    </div>
                  </template>
                </div>
                <div class="zone-card-body">
                  <div class="slds-grid slds-gutters_small">
                    <div class="slds-col">
                      <lightning-combobox
                        name="currencyCode"
                        label={labels.currency}
                        value={currencyCode}
                        options={currencyOptions}
                        dropdown-alignment="auto"
                        disabled={isNotEditable}
                        onchange={handleCurrencyChange}
                      ></lightning-combobox>
                      <template if:true={currencyRateHelpText}>
                        <p class="field-helper-text">{currencyRateHelpText}</p>
                      </template>
                    </div>
                    <div class="slds-col">
                      <lightning-combobox
                        name="contractType"
                        label={labels.contractStatus}
                        value={contractType}
                        options={contractTypeOptions}
                        dropdown-alignment="auto"
                        disabled={isNotEditable}
                        onchange={handleContractTypeChange}
                      ></lightning-combobox>
                    </div>
                    <div class="slds-col">
                      <!-- Palier de séniorité (session 28) : obligatoire à la validation depuis 119,
                           référentiel provisoire (peut être vide) — resserre les repères marché,
                           cf. loadMarketReference. -->
                      <div class="slds-form-element">
                        <label
                          class="slds-form-element__label"
                          for="seniorityLevel"
                        >
                          {labels.seniorityLevel}
                          <abbr class="slds-required" title="required">*</abbr>
                        </label>
                        <lightning-combobox
                          name="seniorityLevel"
                          label={labels.seniorityLevel}
                          variant="label-hidden"
                          value={seniorityLevel}
                          options={seniorityLevelOptions}
                          dropdown-alignment="auto"
                          disabled={isNotEditable}
                          onchange={handleSeniorityLevelChange}
                        ></lightning-combobox>
                      </div>
                    </div>
                  </div>

                  <template if:true={isSalaryBased}>
                    <lightning-input
                      type="number"
                      name="annualSalary"
                      label={unitLabels.annualSalary}
                      value={annualSalary}
                      min="0"
                      step="0.01"
                      message-when-step-mismatch={labels.decimalStepError}
                      disabled={isNotEditable}
                      onchange={handleFieldChange}
                      class="slds-m-top_small"
                    ></lightning-input>
                    <template if:true={showCjmHelper}>
                      <p class="field-helper-text">{cjmHelperText}</p>
                    </template>

                    <!-- Périodes de salaire ajoutées : la période 1 reste le salaire annuel ci-dessus. -->
                    <template if:true={salaryPeriodFirstLabel}>
                      <div
                        class="salary-period-first slds-m-top_x-small slds-text-body_small"
                      >
                        <span>{salaryPeriodFirstLabel}</span>
                      </div>
                    </template>
                    <template for:each={salaryPeriodRows} for:item="row">
                      <div
                        key={row.key}
                        class="salary-period-row slds-m-top_small"
                      >
                        <div
                          class="slds-grid slds-grid_vertical-align-end slds-gutters_small"
                        >
                          <div class="slds-col slds-no-flex fee-period-title">
                            <span>{row.title}</span>
                          </div>
                          <div class="slds-col slds-size_1-of-4">
                            <lightning-input
                              type="number"
                              name="salaryPeriodDays"
                              label={labels.feePeriodDays}
                              value={row.days}
                              min="0"
                              step="1"
                              data-key={row.periodKey}
                              data-field="days"
                              disabled={isNotEditable}
                              onchange={handleSalaryPeriodChange}
                            ></lightning-input>
                          </div>
                          <div class="slds-col slds-grow">
                            <lightning-input
                              type="number"
                              name="salaryPeriodSalary"
                              label={labels.salaryPeriodSalary}
                              value={row.salary}
                              min="0"
                              step="0.01"
                              message-when-step-mismatch={labels.decimalStepError}
                              data-key={row.periodKey}
                              data-field="salary"
                              disabled={isNotEditable}
                              onchange={handleSalaryPeriodChange}
                            ></lightning-input>
                          </div>
                          <div class="slds-col slds-no-flex">
                            <lightning-button-icon
                              icon-name="utility:close"
                              variant="bare"
                              size="small"
                              alternative-text={row.removeLabel}
                              title={row.removeLabel}
                              data-key={row.periodKey}
                              disabled={isNotEditable}
                              onclick={handleRemoveSalaryPeriod}
                            ></lightning-button-icon>
                          </div>
                        </div>
                      </div>
                    </template>
                    <template if:true={salaryPeriodExceedLabel}>
                      <div
                        class="salary-period-exceed slds-m-top_x-small slds-text-color_error"
                        role="alert"
                      >
                        <span>{salaryPeriodExceedLabel}</span>
                      </div>
                    </template>
                    <template if:true={showSalaryPeriodAddLink}>
                      <div class="slds-m-top_x-small">
                        <lightning-button
                          variant="base"
                          label={labels.salaryPeriodAdd}
                          class="salary-period-add"
                          onclick={handleAddSalaryPeriod}
                        ></lightning-button>
                      </div>
                    </template>
                  </template>

                  <!-- INDEP (session 18, maquette pricing-tool.html:1971-1989 ; règle de lecture
                   seule posée en 18b sur `isEditable`, cf. le getter du même nom). Mark-up calculé
                   toujours affiché (jamais éditable, calculé) ; sa légende et l'alerte d'écart sont
                   des aides à la saisie, verrouillées avec le reste. -->
                  <template if:true={isINDEP}>
                    <template if:true={isEditable}>
                      <div
                        class="slds-grid slds-gutters_small slds-m-top_small"
                      >
                        <div class="slds-col">
                          <lightning-input
                            type="number"
                            name="cjmBeforeMarkup"
                            label={unitLabels.cjmBeforeMarkup}
                            value={cjmBeforeMarkup}
                            min="0"
                            step="0.01"
                            message-when-step-mismatch={labels.decimalStepError}
                            onchange={handleFieldChange}
                          ></lightning-input>
                        </div>
                        <div class="slds-col">
                          <lightning-input
                            type="text"
                            label={unitLabels.markupCalculated}
                            value={formattedMarkupCalcule}
                            disabled
                            class="readonly-input"
                          ></lightning-input>
                          <p class="field-helper-text">{markupFormulaLegend}</p>
                        </div>
                        <div class="slds-col">
                          <lightning-input
                            type="number"
                            name="markupApplied"
                            label={unitLabels.markupApplied}
                            value={markupApplied}
                            min="0"
                            step="0.01"
                            message-when-step-mismatch={labels.decimalStepError}
                            onchange={handleFieldChange}
                          ></lightning-input>
                          <template if:true={calc.markupMismatch}>
                            <p class="markup-mismatch-note">
                              ⚠ {markupMismatchMessage}
                            </p>
                          </template>
                        </div>
                      </div>
                    </template>
                    <template if:false={isEditable}>
                      <div
                        class="slds-grid slds-gutters_small slds-m-top_small"
                      >
                        <div class="slds-col">
                          <lightning-input
                            type="text"
                            label={unitLabels.cjmBeforeMarkup}
                            value={displayCjmBeforeMarkup}
                            disabled
                            class="readonly-input"
                          ></lightning-input>
                        </div>
                        <div class="slds-col">
                          <lightning-input
                            type="text"
                            label={unitLabels.markupCalculated}
                            value={formattedMarkupCalcule}
                            disabled
                            class="readonly-input"
                          ></lightning-input>
                        </div>
                        <div class="slds-col">
                          <lightning-input
                            type="text"
                            label={unitLabels.markupApplied}
                            value={displayMarkupApplied}
                            disabled
                            class="readonly-input"
                          ></lightning-input>
                        </div>
                      </div>
                    </template>
                    <p class="field-helper-text slds-m-top_x-small">
                      {i18n.AR_PMS_IndepTotalCostPrefix}
                      <strong
                        >{formattedCjmTotalIndep}{labels.perDayLong}</strong
                      >
                      {i18n.AR_PMS_IndepTotalCostHelp}
                    </p>
                  </template>

                  <!-- VIE (session 18, maquette pricing-tool.html:1913-1941 ; règle de lecture seule
                   posée en 18b) : sélecteur pays, pré-remplissage, encart d'avertissement, note
                   d'écart — tout regroupé dans le bloc `isEditable`, verrouillé d'un bloc avec lui. -->
                  <template if:true={isVIE}>
                    <template if:true={isEditable}>
                      <div
                        class="slds-grid slds-gutters_small slds-m-top_small"
                      >
                        <div class="slds-col">
                          <lightning-combobox
                            name="vieCountryId"
                            label={labels.vieCountry}

                   Coût nul (session 16) : message explicite plutôt que "—/j" + "- 0 €" incohérents. -->
                  <div class="cost-summary-box slds-m-top_medium">
                    <template if:false={isCostCalculable}>
                      <p class="cost-summary-empty">
                        {costNotCalculableMessage}
                      </p>
                    </template>
                    <template if:true={isCostCalculable}>
                      <div
                        class="cost-summary-row cost-summary-cjm"
                        title={cjmWeightedTooltip}
                      >
                        <span class="cost-summary-label"
                          >{cjmSummaryLabel}</span
                        >
                        <span class="cost-summary-value"
                          >{formattedCjm}{labels.perDaySuffix}</span
                        >
                      </div>
                      <template if:true={showFeeOmLine}>
                        <div class="cost-summary-row">
                          <span class="cost-summary-label"
                            >{labels.feesOmDailyLabel}</span
                          >
                          <span class="cost-summary-value"
                            >{formattedFeeOmPerDay}</span
                          >
                        </div>
                      </template>
                      <template if:true={showFeePonctuelsLine}>
                        <div class="cost-summary-row">
                          <span class="cost-summary-label"
                            >{feePonctuelsLineLabel}</span

                            >{formattedFeePonctuelsPerDay}</span

                  <template if:true={hasGrandCompteCorridor}>
                    <div class="grand-compte-banner slds-m-top_medium">
                      <lightning-icon

                      ></lightning-icon>
                      <span class="grand-compte-label"
                        >{thresholdsOriginLabel}
                      </span>
                      <span class="grand-compte-values"
                        >{grandCompteBannerLabel}
                        <span class="grand-compte-standard">
                          {i18n.AR_PMS_StandardCorridor}</span

                  </template>
                  <div class="threshold-row slds-m-top_medium">
                    <div class="threshold-card threshold-floor">

                    </div>
                    <div class="threshold-card threshold-target">
                      <p class="stat-label">{targetPercentLabel}</p>
                      <p class="stat-value">{formattedTjmTarget}</p>
                    </div>
                    <div class="threshold-card threshold-ideal">
                      <p class="stat-label">{idealPercentLabel}</p>
                      <p class="stat-value">{formattedTjmIdeal}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Zone 3 : décision — card maquette (pricing-tool.html:2068-2072) -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <div class="zone-card">
                <div class="zone-card-header">
                  <div class="zone-card-header-left">
                    <span class="zone-badge">3</span>
                    <p class="zone-header-title">{labels.zoneDecisionTitle}</p>
                  </div>

                    type="number"
                    name="proposedTjm"
                    label={unitLabels.proposedTjm}
                    value={proposedTjm}

                    step="0.01"
                    message-when-step-mismatch={labels.decimalStepError}
                    disabled={isNotEditable}
                    onchange={handleFieldChange}

                  <!-- Périodes de TJM (docs/254) : lien, cadre dessiné par son soulignement, frise, une ligne par
                       période, pied pondéré. Le cadre reste dans le DOM pour animer l'ouverture et le repli. -->
                  <template if:true={showTjmPeriodsBlock}>
                    <div

                      onmouseenter={handleTjmBlockMouseEnter}
                      onmouseleave={handleTjmBlockMouseLeave}

                      <template if:true={showTjmPeriodsLink}>
                        <button
                          type="button"
                          class="tjm-text-btn tjm-toggle"
                          aria-expanded={tjmToggleExpanded}
                          aria-controls="tjm-periods-panel"
                          onclick={handleToggleTjmPeriods}
                          onmouseleave={handleTjmTextButtonLeave}
                        >
                          <svg
                            class="tjm-chevron"
                            viewBox="0 0 10 10"
                            aria-hidden="true"
                          >
                            <path
                              d="M1.5 3.5 5 7l3.5-3.5"

                              stroke-width="1.4"
                              stroke-linecap="round"
                              stroke-linejoin="round"

                      <div class="tjm-frame">

                        <span class="tjm-frame-rest" aria-hidden="true"></span>
                        <div class="tjm-unfold">

                            <div
                              id="tjm-periods-panel"

                                <div class="tjm-collapse">
                                  <div class="tjm-collapse-inner">
                                    <div
                                      class="tjm-timeline-ends tjm-fade-item tjm-fade-item_down"
                                      style="--i: 0; --ri: 0"
                                    >
                                      <span>{tjmTimelineStartLabel}</span>
                                      <span>{tjmTimelineEndLabel}</span>
                                    </div>
                                  </div>
                                </div>
                                <div
                                  class="tjm-timeline"
                                  role={tjmTimelineRole}
                                  tabindex={tjmTimelineTabindex}
                                  title={tjmTimelineTitle}
                                  aria-expanded={tjmTimelineAriaExpanded}

                                  onmouseleave={handleTjmTimelineMouseLeave}

                                  onkeydown={handleTjmTimelineKeydown}

                                  <template
                                    for:each={tjmTimelineSegments}

                                      class={seg.className}

                                      <span class="tjm-segment-full">
                                        <span class="tjm-segment-tjm"
                                          >{seg.tjmLabel}</span
