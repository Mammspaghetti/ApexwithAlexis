                                        <span class="tjm-segment-days"
                                          >{seg.daysLabel}</span
                                        >
                                      </span>
                                      <span
                                        class="tjm-segment-line"
                                        aria-hidden="true"
                                      >
                                        <span
                                          ><span class="tjm-segment-line-tjm"
                                            >{seg.tjmLabel}</span
                                          ><span class="tjm-segment-line-days">
                                            · {seg.daysLabel}</span
                                          ></span
                                        >
                                      </span>
                                    </div>
                                  </template>
                                </div>
                              </template>
                              <div class="tjm-collapse">
                                <div class="tjm-collapse-inner">
                                  <template if:true={tjmMissionUnknown}>
                                    <p
                                      class="tjm-periods-message tjm-fade-item"
                                      style={tjmMessageStyle}
                                    >
                                      {labels.tjmPeriodsMissionUnknown}
                                    </p>
                                  </template>
                                  <template if:true={tjmExceedLabel}>
                                    <p
                                      class="tjm-periods-message tjm-fade-item"
                                      style={tjmMessageStyle}
                                    >
                                      {tjmExceedLabel}
                                    </p>
                                  </template>
                                  <template if:true={hasTjmPeriods}>
                                    <div
                                      class="tjm-period-row tjm-fade-item"
                                      style={tjmFirstRow.style}
                                    >
                                      <span
                                        class={tjmFirstRow.colorClass}
                                      ></span>
                                      <span class="tjm-period-title"
                                        >{tjmFirstRow.label}</span
                                      >
                                      <span
                                        class="tjm-field tjm-field-days"
                                      ></span>
                                      <span
                                        class="tjm-field tjm-field-tjm tjm-period-first-value"
                                        ><span class="tjm-first-amount"
                                          >{tjmFirstRow.amount}</span
                                        ><span
                                          class="tjm-field-unit"
                                          aria-hidden="true"
                                          >{tjmFirstRow.symbol}</span
                                        ></span
                                      >
                                      <template if:false={isNotEditable}>
                                        <span class="tjm-remove-slot"></span>
                                      </template>
                                    </div>
                                    <template
                                      for:each={tjmPeriodRows}
                                      for:item="row"
                                    >
                                      <div
                                        class="tjm-period-row tjm-fade-item"
                                        style={row.style}
                                        key={row.key}
                                      >
                                        <span class={row.colorClass}></span>
                                        <span class="tjm-period-title"
                                          >{row.title}</span
                                        >
                                        <span class="tjm-field tjm-field-days">
                                          <input
                                            class="slds-input tjm-period-input"
                                            type="number"
                                            min="1"
                                            step="1"
                                            data-key={row.periodKey}
                                            data-field="days"
                                            aria-label={row.daysAria}
                                            value={row.days}
                                            disabled={isNotEditable}
                                            oninput={handleTjmPeriodChange}
                                          />
                                          <span
                                            class="tjm-field-unit"
                                            aria-hidden="true"
                                            >{labels.tjmPeriodDaysUnit}</span
                                          >
                                        </span>
                                        <span class="tjm-field tjm-field-tjm">
                                          <input
                                            class="slds-input tjm-period-input"
                                            type="number"
                                            min="0"
                                            step="0.01"
                                            data-key={row.periodKey}
                                            data-field="tjm"
                                            aria-label={row.tjmAria}
                                            value={row.tjm}
                                            disabled={isNotEditable}
                                            oninput={handleTjmPeriodChange}
                                          />
                                          <span
                                            class="tjm-field-unit"
                                            aria-hidden="true"
                                            >{row.currencySymbol}</span
                                          >
                                        </span>
                                        <template if:false={isNotEditable}>
                                          <span class="tjm-remove-slot">
                                            <lightning-button-icon
                                              variant="bare"
                                              icon-name="utility:close"
                                              alternative-text={row.removeLabel}
                                              title={row.removeLabel}
                                              data-key={row.periodKey}
                                              onclick={handleRemoveTjmPeriod}
                                            ></lightning-button-icon
                                          ></span>
                                        </template>
                                      </div>
                                    </template>
                                  </template>
                                  <template if:true={showTjmPeriodAddLink}>
                                    <div
                                      class="tjm-add-row tjm-fade-item"
                                      style={tjmAddLinkStyle}

                                      <button
                                        type="button"
                                        class="tjm-text-btn"
                                        onclick={handleAddTjmPeriod}
                                        onmouseleave={handleTjmTextButtonLeave}
                                      >
                                        {labels.tjmPeriodAdd}
                                      </button>
                                    </div>
                                  </template>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                        <template if:true={hasTjmPeriods}>
                          <div
                            class={tjmFooterClass}
                            role={tjmFooterRole}
                            tabindex={tjmFooterTabindex}
                            aria-expanded={tjmFooterAriaExpanded}
                            onclick={handleTjmFooterClick}
                            onkeydown={handleTjmFooterKeydown}
                          >
                            <span class="tjm-weighted-label"
                              >{labels.tjmWeightedFooter}</span
                            >
                            <span class="tjm-weighted-value"
                              >{tjmWeightedFormatted}</span
                            >
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Hiérarchie zone 3 (session 16, pricing-tool.html:2079-2083) : une valeur dominante
                   + une ligne de contexte, plus 3 tuiles de poids égal (l'ancienne "Remise vs cible"
                   a déjà quitté cette grille en session 15 pour devenir la note à côté du badge). -->
                  <div class="mc2-nego-row slds-m-top_medium">
                    <div class="mc2-dominant-block">
                      <p class="stat-label">{labels.mc2PerDayLabel}</p>
                      <p class={mc2DominantValueClass}>{formattedMc2PerDay}</p>
                      <template if:true={mc2ContextLine}>
                        <p class="mc2-context-line">{mc2ContextLine}</p>
                      </template>
                    </div>
                    <!-- Prix de négociation 2 et 3 : indicatifs, hors workflow. Éléments natifs stylés SLDS (le
                         lightning-input n'est pas stylable ici, cf. CLAUDE.md règle des deux tentatives). -->
                    <div
                      class="nego-fields"
                      role="group"
                      aria-label={labels.negoPriceHelp}
                      onpointerdown={handleNegoPointerDown}
                      onmouseenter={handleNegoMouseEnter}
                      onmouseleave={handleNegoMouseLeave}
                      onfocusin={handleNegoFieldFocusIn}
                      onfocusout={handleNegoFieldFocusOut}
                    >
                      <div class="nego-field nego-field-grid">
                        <label class="nego-label" for="clientGrid"
                          >{labels.clientGridLabel}</label
                        >
                        <span
                          class="nego-grid-box"
                          title={labels.clientGridHelp}
                        >
                          <input
                            id="clientGrid"
                            type="checkbox"
                            name="clientGrid"
                            checked={clientGrid}
                            disabled={isNotEditable}
                            onchange={handleClientGridChange}
                          />
                        </span>
                      </div>
                      <div class="nego-field">
                        <label class="nego-label" for="negoPrice2"
                          >{labels.negoColPrice2}</label
                        >
                        <span class="nego-input-wrap">
                          <input
                            id="negoPrice2"
                            class="slds-input nego-input"
                            type="number"
                            name="negoPrice2"
                            min="0"
                            step="0.01"
                            value={negoPrice2Input}
                            disabled={isNegoInputDisabled}
                            oninput={handleNegoInput}
                            onchange={handleFieldChange}
                            onblur={handleNegoBlur}
                            onkeydown={handleNegoKey}
                          />
                          <span class="nego-input-unit" aria-hidden="true"
                            >{negoCurrencySymbol}</span
                          >
                        </span>
                        <template if:true={negoPrice2Message}>
                          <p class={negoPrice2MessageClass}>
                            {negoPrice2Message.text}
                          </p>
                        </template>
                      </div>
                      <div class="nego-field">
                        <label class="nego-label" for="negoPrice3"
                          >{labels.negoColPrice3}</label
                        >
                        <span class="nego-input-wrap">
                          <input
                            id="negoPrice3"
                            class="slds-input nego-input"
                            type="number"
                            name="negoPrice3"
                            min="0"
                            step="0.01"
                            value={negoPrice3Input}
                            disabled={isNegoInputDisabled}
                            oninput={handleNegoInput}
                            onchange={handleFieldChange}
                            onblur={handleNegoBlur}
                            onkeydown={handleNegoKey}
                          />
                          <span class="nego-input-unit" aria-hidden="true"
                            >{negoCurrencySymbol}</span
                          >
                        </span>
                        <template if:true={negoPrice3Message}>
                          <p class={negoPrice3MessageClass}>
                            {negoPrice3Message.text}
                          </p>
                        </template>
                      </div>
                    </div>
                  </div>
                  <!-- Décomposition MC2 (session 15, pricing-tool.html:2085-2096 ; session 150 : une décimale alignée) -->
                  <template if:true={showMc2Breakdown}>
                    <div
                      class={mc2BreakdownBoxClass}
                      onpointerdown={handleNegoPointerDown}
                      onmouseenter={handleNegoMouseEnter}
                      onmouseleave={handleNegoMouseLeave}
                    >
                      <template if:true={hasNegoColumns}>
                        <button
                          type="button"
                          class="nego-handle"
                          data-id="nego-toggle"
                          aria-expanded={negoToggleExpanded}
                          aria-controls={negoControlsIds}
                          onclick={handleToggleNegoColumns}
                        >
                          <svg
                            class="tjm-chevron"
                            viewBox="0 0 10 10"
                            aria-hidden="true"
                          >
                            <path
                              d="M1.5 3.5 5 7l3.5-3.5"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="1.4"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            />
                          </svg>
                          <span class="nego-handle-text"
                            >{negoToggleLabel}</span
                          >
                        </button>
                        <div
                          class={negoHeadClass}
                          data-id="nego-head"
                          aria-hidden={negoHeadAriaHidden}
                        >
                          <div class="nego-head-inner">
                            <div class="mc2-breakdown-row nego-head-row">
                              <span></span>
                              <span>{labels.negoColPrice1}</span>
                              <template for:each={negoColumns} for:item="col">
                                <span key={col.key} data-id="nego-head-cell"
                                  >{col.header}</span
                                >
                              </template>
                            </div>
                          </div>
                        </div>
                      </template>
                      <div
                        class="mc2-breakdown-row mc2-breakdown-row-has-extra"
                      >
                        <template if:true={tjmBasketCaption}>
                          <div>
                            <span class="mc2-breakdown-label"
                              >{invoicedTjmLabel}</span
                            >
                            <p class="breakdown-line-caption">
                              {tjmBasketCaption}
                            </p>
                          </div>
                        </template>
                        <template if:false={tjmBasketCaption}>
                          <div>
                            <span class="mc2-breakdown-label"
                              >{invoicedTjmLabel}</span
                            >
                          </div>
                        </template>
                        <span class="mc2-breakdown-strong mc2-breakdown-amount">
                          <span class="amt-int"
                            >{proposedTjmBreakdown.intPart}</span
                          ><span class={proposedTjmBreakdown.decClass}
                            >{proposedTjmBreakdown.decPart}</span
                          >&nbsp;{proposedTjmBreakdown.symbol}
                        </span>
                        <template for:each={negoColumns} for:item="col">
                          <span
                            id={col.tjmId}
                            class="mc2-breakdown-amount mc2-breakdown-extra"
                            key={col.key}
                          >
                            <template lwc:if={col.tjm.show}>
                              <span class="amt-int">{col.tjm.intPart}</span
                              ><span class={col.tjm.decClass}
                                >{col.tjm.decPart}</span
                              >&nbsp;{col.tjm.symbol}
                            </template>
                          </span>
                        </template>
                      </div>
                      <template if:true={showRfaLineInBreakdown}>
                        <div class="mc2-breakdown-row mc2-breakdown-row-rfa">
                          <span>{rfaBreakdownLabel}</span>
                          <span class="mc2-breakdown-amount"
                            >-&nbsp;<span class="amt-int"
                              >{rfaAmountBreakdown.intPart}</span
                            ><span class={rfaAmountBreakdown.decClass}
                              >{rfaAmountBreakdown.decPart}</span
                            >&nbsp;{rfaAmountBreakdown.symbol}</span
                          >
                          <template for:each={negoColumns} for:item="col">
                            <span
                              class="mc2-breakdown-amount mc2-breakdown-extra"
                              key={col.key}
                            >
                              <template lwc:if={col.rfa.show}
                                >-&nbsp;<span class="amt-int"
                                  >{col.rfa.intPart}</span
                                ><span class={col.rfa.decClass}
                                  >{col.rfa.decPart}</span
                                >&nbsp;{col.rfa.symbol}</template
                              >
                            </span>
                          </template>
                        </div>
                      </template>
                      <div class="mc2-breakdown-row">
                        <span>{labels.netRevenueAfterRfa}</span>
                        <span class="mc2-breakdown-strong mc2-breakdown-amount">
                          <span class="amt-int"
                            >{netRevenueAfterRfaBreakdown.intPart}</span
                          ><span class={netRevenueAfterRfaBreakdown.decClass}
                            >{netRevenueAfterRfaBreakdown.decPart}</span
                          >&nbsp;{netRevenueAfterRfaBreakdown.symbol}
                        </span>
                        <template for:each={negoColumns} for:item="col">
                          <span
                            class="mc2-breakdown-amount mc2-breakdown-extra"
                            key={col.key}
                          >
                            <template lwc:if={col.net.show}>
                              <span class="amt-int">{col.net.intPart}</span
                              ><span class={col.net.decClass}
                                >{col.net.decPart}</span
                              >&nbsp;{col.net.symbol}
                            </template>
                          </span>
                        </template>
                      </div>
                      <template for:each={costBreakdownLines} for:item="line">
                        <div
                          class="mc2-breakdown-row"
                          key={line.key}
                          title={line.title}
                        >
                          <div>
                            <span>{line.label}</span>
                            <template if:true={line.caption}>
                              <p class="breakdown-line-caption">
                                {line.caption}
                              </p>
                            </template>
                          </div>
                          <span class="mc2-breakdown-amount"
                            >-&nbsp;<span class="amt-int">{line.intPart}</span
                            ><span class={line.decClass}>{line.decPart}</span
                            >&nbsp;{line.symbol}</span
                          >
                        </div>
                      </template>
                      <div class="mc2-breakdown-row mc2-breakdown-row-subtotal">
                        <span>{labels.totalDailyCost}</span>
                        <span class="mc2-breakdown-amount"
                          >-&nbsp;<span class="amt-int"
                            >{totalDailyCostBreakdown.intPart}</span
                          ><span class={totalDailyCostBreakdown.decClass}
                            >{totalDailyCostBreakdown.decPart}</span
                          >&nbsp;{totalDailyCostBreakdown.symbol}</span
                        >
                      </div>
                      <template lwc:if={isRplsrActive}>
                        <div
                          class="mc2-breakdown-row mc2-breakdown-row-rplsr"
                          data-id="rplsr-gap"
                        >
                          <div>
                            <span>{labels.rplsrProductionGap}</span>
                            <p class="breakdown-line-caption">
                              {rplsrGapCaption}
                            </p>
                          </div>
                          <span class={rplsrGapBreakdown.amountClass}
                            >{rplsrGapBreakdown.sign}&nbsp;<span class="amt-int"
                              >{rplsrGapBreakdown.intPart}</span
                            ><span class={rplsrGapBreakdown.decClass}
                              >{rplsrGapBreakdown.decPart}</span
                            >&nbsp;{rplsrGapBreakdown.symbol}</span
                          >
                        </div>
                      </template>
                      <div
                        class="mc2-breakdown-row mc2-breakdown-row-total mc2-breakdown-row-has-extra"
                      >
                        <span class="mc2-breakdown-label"
                          >{labels.mc2PerDayLabel}
                          <span class="mc2-breakdown-percent">
                            ({formattedMc2Percent})</span
                          ><template lwc:if={showRplsrClassicStrike}
                            ><span
                              class="mc2-breakdown-rplsr-classic"
                              title={labels.rplsrClassicTitle}
                              data-id="rplsr-classic"
                              >{rplsrClassicMc2Percent}</span
                            ></template
                          ></span
                        >
                        <span class={mc2BreakdownValueClass}
                          ><span class="mc2-breakdown-amount"
                            ><span class="amt-int"
                              >{mc2PerDayBreakdown.intPart}</span
                            ><span class={mc2PerDayBreakdown.decClass}
                              >{mc2PerDayBreakdown.decPart}</span
                            >&nbsp;{mc2PerDayBreakdown.symbol}</span
                          ></span
                        >
                        <template for:each={negoColumns} for:item="col">
                          <span class="nego-mc2-cell" key={col.key}>
                            <span
                              class="mc2-breakdown-amount mc2-breakdown-extra"
                              ><span class="amt-int">{col.mc2.intPart}</span
                              ><span class={col.mc2.decClass}
                                >{col.mc2.decPart}</span
                              >&nbsp;{col.mc2.symbol}<span
                                class={col.percentClass}
                                >{col.mc2Percent}</span
                              ></span
                            >
                          </span>
                        </template>
                      </div>
                    </div>
                  </template>

                  <div class="slds-m-top_medium segment-row">
                    <span class={segmentClass}>{segmentLabel}</span>
                    <template if:true={showDiscountVsTarget}>
                      <span class="discount-note">{discountVsTargetLabel}</span>
                    </template>
                  </div>

                  <!-- Bandeaux d'alerte contextuels (session 15, pricing-tool.html:2104-2107) : rétablis -->
                  <template if:true={showBelowFloorBanner}>
                    <div class="alert-banner alert-banner-red">
                      <lightning-icon
                        icon-name="utility:warning"
                        size="x-small"
                        class="alert-banner-icon"
                      ></lightning-icon>
                      <div>
                        <p class="alert-banner-title">
                          {labels.mc2InsufficientTitle}
                        </p>
                        <p class="alert-banner-text">
                          {belowFloorBannerMessage}
                        </p>
                      </div>
                    </div>
                  </template>
                  <template if:true={showLowMarginBanner}>
                    <div class="alert-banner alert-banner-amber">
                      <lightning-icon
                        icon-name="utility:warning"
                        size="x-small"
                        class="alert-banner-icon"
                      ></lightning-icon>
                      <p class="alert-banner-text">{lowMarginBannerMessage}</p>
                    </div>
                  </template>
                  <template if:true={showRecommendedBanner}>
                    <div class="alert-banner alert-banner-amber">
                      <lightning-icon
                        icon-name="utility:info"
                        size="x-small"
                        class="alert-banner-icon"
                      ></lightning-icon>
                      <p class="alert-banner-text">
                        {recommendedBannerMessage}
                      </p>
                    </div>
                  </template>
                  <template if:true={showSuperstarBanner}>
                    <div class="alert-banner alert-banner-green">
                      <lightning-icon
                        icon-name="utility:check"
                        size="x-small"
                        class="alert-banner-icon"
                      ></lightning-icon>
                      <p class="alert-banner-text">{superstarBannerMessage}</p>
                    </div>
                  </template>

                  <!-- Panneau Arguments de vente (session 28, spec §5.1/§6.4) : repliable, replié
                       par défaut, aux côtés de la décision de prix. Producteur algorithmique
                       (arSalesArgumentsEngine), sans LLM (CLAUDE.md, lot 1) — cf. commentaire de
                       tête du module pour la frontière posée pour la phase 4. -->
                  <c-ar-sales-arguments-panel
                    arguments={salesArguments}
                    unavailable-notes={salesArgumentsUnavailableNotes}
                  ></c-ar-sales-arguments-panel>
                </div>
              </div>
            </div>
          </div>

          <!-- Régie sans régule (docs/265 §5) : plan de production mensuel, juste avant la jauge -->
          <template lwc:if={showRplsrCard}>
            <c-ar-rplsr-plan
              class="rplsr-plan slds-m-top_medium"
              enabled={rplsrEnabled}
              days-per-month={rplsrDaysPerMonth}
              months={rplsrMonths}
              read-only={isNotEditable}
              ontoggle={handleRplsrToggle}
              onbasechange={handleRplsrBaseChange}
              onproducedchange={handleRplsrProducedChange}
            ></c-ar-rplsr-plan>
          </template>

          <!-- Jauge corridor : card autonome (pricing-tool.html:2066, 960-991) -->
          <div class="zone-card gauge-card slds-m-top_medium">
            <div class="zone-card-body">
              <div class="gauge-header">
                <span class="gauge-header-title">{labels.gaugeTitle}</span>
                <div class="gauge-header-right">
                  <template lwc:if={gaugeHeaderPill}>
                    <span class={gaugeHeaderPill.cssClass}
                      >{gaugeHeaderPill.text}</span
                    >
                  </template>
                  <template if:true={hasProposedTjm}>
                    <span class="gauge-header-tjm">{gaugeTitleTjmLabel}</span>
                  </template>
                </div>
              </div>
              <!-- Masquée quand les seuils ne sont pas calculables (session 17b) : sans CJM les 3
                   seuils valent 0€, la jauge n'a plus aucun sens (matrice VOLVO, cf.
                   docs/15-diff-maquette-org.md). Réutilise `isCostCalculable` directement (session 18) —
                   pas un alias dédié en plus des cards de seuils et de la tuile MC2 qui partagent la
                   même condition juste en dessous. -->
              <template if:false={isCostCalculable}>
                <p class="cost-summary-empty">{labels.gaugeNotPositionable}</p>
              </template>
              <template if:true={isCostCalculable}>
                <div class="gauge-stage" style={gaugeView.stageStyle}>
                  <!-- Étage des prix : pastilles au-dessus de la piste, reliées à leur repère par une tige. -->
                  <template for:each={gaugeView.prices} for:item="price">
                    <div
                      key={price.key}
                      class="gauge-price"
                      data-id={price.key}
                    >
                      <span
                        class={price.stemClass}
                        style={price.stemStyle}
                      ></span>
                      <span
                        class={price.pillClass}
                        style={price.pillStyle}
                        title={price.title}
                        ><span class={price.tagClass}>{price.tag}</span
                        ><template lwc:if={price.value}>
                          <span class="gauge-pill-value">{price.value}</span>
                        </template></span
                      >
                    </div>
                  </template>
                  <div class="gauge-track" style={gaugeView.trackStyle}>
                    <template for:each={gaugeView.separators} for:item="sep">
                      <span
                        key={sep.key}
                        class="gauge-separator"
                        style={sep.style}
                      ></span>
                    </template>
                    <template for:each={gaugeNegoMarkers} for:item="marker">
                      <span
                        key={marker.key}
                        class={marker.tickClass}
                        style={marker.tickStyle}
                        title={marker.title}
                      ></span>
                    </template>
                    <template lwc:if={showRplsrGhost}>
                      <div
                        class="gauge-rplsr-ghost"
                        style={rplsrGhostStyle}
                        title={rplsrGhostTitle}
                        data-id="rplsr-ghost"
                      >
                        <span class="gauge-rplsr-ghost-dot"></span>
                      </div>
                    </template>
                    <div class="gauge-cursor-wrap" style={gaugeCursorStyle}>
                      <span class={gaugeCursorClass}></span>
                    </div>
                  </div>
                  <!-- Étage des seuils : trait à la position exacte du seuil, étiquette dessous (étagée si besoin). -->
                  <template
                    for:each={gaugeView.thresholds}
                    for:item="threshold"
                  >
                    <div
                      key={threshold.key}
                      class="gauge-threshold"
                      data-id={threshold.key}
                    >
                      <span
                        class="gauge-threshold-tick"
                        style={threshold.tickStyle}
                      ></span>
                      <div
                        class={threshold.labelClass}
                        style={threshold.labelStyle}
                      >
                        <div class={threshold.nameClass}>
                          {threshold.name}<template
                            lwc:if={threshold.hasHelpText}
                            ><lightning-helptext
                              content={gaugeCeilingHelpText}
                            ></lightning-helptext
                          ></template>
                        </div>
                        <div class="gauge-ruler-value">
                          {threshold.valueText}<span class="gauge-ruler-mc2"
                            >{threshold.mc2Text}</span
                          >
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
                <div class="gauge-legend">
                  <div class="gauge-legend-zones">
                    <template for:each={gaugeLegendItems} for:item="item">
                      <div key={item.key} class="gauge-legend-item">
                        <span
                          class="gauge-legend-swatch"
                          style={item.swatchStyle}
                        ></span>
                        <span>{item.label}</span>
                      </div>
                    </template>
                  </div>
                  <div class="gauge-legend-marks">
                    <div class="gauge-legend-item">
                      <span class="gauge-legend-dot"></span>
                      <span>{labels.gaugeLegendPrice}</span>
                    </div>
                    <template lwc:if={hasGaugeNegoMarkers}>
                      <div class="gauge-legend-item">
                        <span class="gauge-legend-bar"></span>
                        <span>{labels.gaugeLegendNego}</span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Pied de page : action principale pleine largeur (session 16, pricing-tool.html:2108-2126) -->
          <template if:true={isEditable}>
            <div class="footer-actions slds-m-top_large">
              <button
                class="btn btn-secondary"
                disabled={isActionDisabled}
                onclick={handleSaveDraft}
                type="button"
              >
                {labels.saveDraftButton}
              </button>
              <!-- Trois états mutuellement exclusifs (session 15, pricing-tool.html:2108-2115) -->
              <template if:true={showNoTjmButton}>
                <button
                  class="btn btn-disabled-state footer-action-main"
                  disabled
                  type="button"
                >
                  {labels.enterTjmToContinue}
                </button>
              </template>
              <template if:true={showDerogationButton}>
                <button
                  class="btn btn-danger footer-action-main"
                  disabled={isDerogationActionDisabled}
                  onclick={handleOpenDerogationModal}
                  type="button"
                >
                  <lightning-icon
                    icon-name="utility:warning"
                    size="xx-small"
                    variant="inverse"
                  ></lightning-icon>
                  {labels.requestDerogation}
                </button>
              </template>
              <template if:true={showValidateButton}>
                <button
                  class="btn btn-success footer-action-main"
                  disabled={isValidateDisabled}
                  onclick={handleValidate}
                  type="button"
                >
                  <lightning-icon
                    icon-name="utility:check"
                    size="xx-small"
                    variant="inverse"
                  ></lightning-icon>
                  {labels.validateMatrixButton}
                </button>
              </template>
            </div>
          </template>

          <!-- Génération PTF (session 20 ; déplacée ici en session 20c, après la décision — cf.
               docs/12-ui-header.md et le constat de régression : la lecture 1-2-3 de la maquette se
               lit décision d'abord, action ensuite, pas l'inverse. -->
          <template if:true={isValidatedStatus}>
            <c-ar-ptf-panel
              record-id={matrixId}
              open-on-arrival={openPtfOnArrival}
              read-only={readOnlyAccess}
            ></c-ar-ptf-panel>
          </template>
        </template>
      </div>
    </template>

    <!-- Session 107 : panneau de blocage pour prérequis PTF manquants -->
    <template if:true={showValidationPrerequisitesPanel}>
      <div
        class="prerequisites-panel slds-box slds-box_small slds-m-bottom_medium slds-theme_alert-texture slds-theme_alert"
        role="alert"
      >
        <div class="slds-grid">
          <div class="slds-col slds-size_11-of-12">
            <template if:true={hasBlockingPrerequisites}>
              <p class="slds-text-heading_small slds-m-bottom_small">
                {i18n.AR_PMS_PrerequisitesBlockingTitle}
              </p>
              <ul class="prerequisites-list">
                <template
                  for:each={validationPrerequisitesMissing}
                  for:item="prereq"
                >
                  <li key={prereq.label} class="prerequisites-item">
                    <strong>{prereq.label}</strong> — {prereq.whereToFix}
                  </li>
                </template>
              </ul>
            </template>
            <template if:true={hasPrerequisiteWarnings}>
              <p
                class="slds-text-heading_small slds-m-vertical_small prerequisites-warnings-title"
              >
                {i18n.AR_PMS_PrerequisitesWarningTitle}
              </p>
              <ul class="prerequisites-warnings-list">
                <template
                  for:each={validationPrerequisitesWarnings}
                  for:item="warn"
                >
                  <li key={warn.label} class="prerequisites-warning-item">
                    <strong>{warn.label}</strong> — {warn.whereToFix}
                  </li>
                </template>
              </ul>
            </template>
          </div>
          <div class="slds-col slds-size_1-of-12 slds-text-align_right">
            <button
              class="btn btn-icon"
              type="button"
              onclick={handleCloseValidationPrerequisitesPanel}
              title={i18n.AR_Common_Close}
              aria-label={i18n.AR_PMS_ClosePanel}
            >
              <lightning-icon
                icon-name="utility:close"
                size="small"
              ></lightning-icon>
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Modale de demande de dérogation -->
    <template if:true={showDerogationModal}>
      <section
        role="dialog"
        tabindex="-1"
        class="slds-modal slds-fade-in-open"
        aria-modal="true"
        aria-labelledby="derogation-modal-heading"
      >
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <h2 id="derogation-modal-heading" class="slds-text-heading_medium">
              {labels.requestDerogation}
            </h2>
          </header>
          <div class="slds-modal__content slds-p-around_medium">
            <p class="derogation-recall">{derogationRecallMessage}</p>
            <template if:true={derogationValidationError}>
              <div
                class="slds-box slds-box_small slds-m-bottom_medium slds-theme_alert-texture slds-theme_alert"
                role="alert"
              >
                <p>{derogationValidationError}</p>
              </div>
            </template>
            <lightning-combobox
              name="derogationValidator"
              label={labels.validator}
              field-level-help={labels.validatorFieldHelp}
              value={derogationValidatorId}
              options={validatorOptions}
              dropdown-alignment="auto"
              placeholder={labels.selectValidatorPlaceholder}
              onchange={handleDerogationValidatorChange}
            ></lightning-combobox>
            <c-ar-reason-multi-select
              usage="derogation"
              label={labels.derogationReasonsLabel}
              required="true"
              class="slds-m-top_small"
              onchange={handleDerogationReasonsChange}
            ></c-ar-reason-multi-select>
            <lightning-textarea
              name="derogationReason"
              label={labels.freeCommentLabel}
              value={derogationReason}
              required
              onchange={handleDerogationReasonChange}
              class="slds-m-top_small"
            ></lightning-textarea>
          </div>
          <footer class="slds-modal__footer">
            <button
              class="btn btn-secondary"
              onclick={handleCloseDerogationModal}
              type="button"
            >
              {labels.cancel}
            </button>
            <button
              class="btn btn-primary slds-m-left_x-small"
              disabled={isDerogationSendDisabled}
              onclick={handleConfirmDerogation}
              type="button"
            >
              {labels.sendRequest}
            </button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Modale de duplication (session 22) -->
    <c-ar-matrix-duplicate-modal
      open={showDuplicateModal}
      source-matrix-id={matrixId}
      source-position-id={positionId}
      source-position-label={duplicateSourcePositionLabel}
      is-chain-duplication={isChainDuplication}
      oncancel={handleCloseDuplicateModal}
      onduplicated={handleMatrixDuplicated}
    ></c-ar-matrix-duplicate-modal>

    <!-- Modale d'avenant (session 180c) -->
    <c-ar-avenant-modal
      open={showAvenantModal}
      source-matrix-id={matrixId}
      oncancel={handleCloseAvenantModal}
      oncreated={handleAvenantCreated}
    ></c-ar-avenant-modal>
  </div>
</template>
